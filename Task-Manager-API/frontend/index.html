<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <header>
      <h1><i class="fas fa-tasks"></i> Task Manager</h1>
    </header>

    <div class="card">
      <form id="addTaskForm" class="add-task-form">
        <div class="form-group">
          <label for="taskTitle"><i class="fas fa-pen"></i> Title</label>
          <input type="text" id="taskTitle" placeholder="Write a task..." required>
        </div>
        <div class="form-group">
          <label for="taskPriority"> Priority</label>
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <button type="submit" class="btn">Add Task</button>
      </form>

      <div id="statusMessage" role="status" aria-live="polite" style="display:none;"></div>
    </div>

    <div class="card" style="padding: 1rem 1.8rem;">
      <div class="filter-bar">
        <div><i class="fas fa-filter"></i> Filter by priority:</div>
        <select id="filterPriority">
          <option value="all">All</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <button id="refreshBtn" class="btn btn-outline">Refresh</button>
      </div>
    </div>

    <div id="taskContainer" class="task-grid"></div>
  </div>
</body>
</html>
